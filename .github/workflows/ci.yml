name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every combination instead of cancelling siblings on the first
      # failure — one red cell used to hide the state of the other eight.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # pyproject.toml declares requires-python >= 3.10, so 3.9 could never
        # resolve `pip install -e .` and only produced misleading failures.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-asyncio is required: pyproject sets `--strict-markers`, so
          # without it every @pytest.mark.asyncio test became a hard collection
          # error ("'asyncio' not found in `markers`") and aborted the run.
          pip install pytest pytest-asyncio psutil requests
          # The optional extras are NOT optional for the test suite: tests patch
          # core.screenshot.mss (needs [screenshot]) and exercise the win32 /
          # uiautomation paths (needs [windows]). Without them ~84 tests failed
          # on windows-latest and ~20 on ubuntu-latest with AttributeError.
          # The [windows] pins all carry sys_platform == 'win32' markers, so this
          # is a no-op on Linux.
          pip install -e ".[screenshot,windows]" || pip install -e . || true

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        # NB: `src/` is not tracked in this repo (it holds only gitignored
        # __pycache__ dirs), so linting it failed with E902 FileNotFoundError on
        # every run. Lint the real packages instead.
        run: |
          # Stop the build on syntax errors and undefined names
          flake8 core api gui tests main.py config.py setup.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other findings as warnings
          flake8 core api gui tests main.py config.py setup.py \
            --count --exit-zero --max-line-length=120 --statistics
